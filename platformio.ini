; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:cubecell_board]
platform = heltec-cubecell
board = cubecell_board_V2
framework = arduino
monitor_speed = 115200


lib_deps = 
    zinggjm/GxEPD2@^1.6.9
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.6


# 1. Forza l'inclusione della cartella include nei path di sistema (-isystem)
# 2. Disabilita la compilazione dei componenti extra non necessari di GxEPD2
build_flags = 
    -isystem include
    -I src
    -D DISABLE_DIAGNOSTICS=1
